# LunarLander PPO candidate after the baseline and diagnostic runs.
# Keep the exact same file for both seeds; at most two million environment steps.
algorithm: ppo
env_id: LunarLander-v3
seed: 1
cuda: false
total_timesteps: 2000000
num_envs: 16
track: true
capture_video: false
save_model: true
checkpoint_every: 0
network: DiscreteActorCritic
network_kwargs:
  activation: Tanh
  hidden_layers_size: 64
ppo:
  learning_rate: 2.5e-4
  anneal_lr: false
  num_steps: 1024
  gamma: 0.999
  gae_lambda: 0.98
  num_minibatches: 256
  update_epochs: 4
  norm_adv: true
  clip_coef: 0.2
  clip_vloss: true
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  target_kl: null
