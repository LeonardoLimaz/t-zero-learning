# Honest A2C comparison on LunarLander with the same two-million-step budget.
algorithm: a2c
env_id: LunarLander-v3
seed: 1
cuda: false
total_timesteps: 2000000
num_envs: 8
track: true
capture_video: false
save_model: true
checkpoint_every: 0
network: DiscreteActorCritic
network_kwargs:
  activation: Tanh
  hidden_layers_size: 128
a2c:
  learning_rate: 3.0e-4
  num_steps: 16
  gamma: 0.999
  vf_coef: 0.5
  ent_coef: 0.01
  max_grad_norm: 0.5
  use_baseline: true
